name: Extract Store ZIP

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website safely into site/
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          archives = sorted(
              (p for p in root.glob('*.zip') if p.is_file()),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          if not archives:
              raise SystemExit('ERROR: Upload the project ZIP to the repository root first.')

          archive = archives[0]
          with zipfile.ZipFile(archive) as z:
              files = [n for n in z.namelist() if not n.endswith('/')]
              if not files:
                  raise SystemExit('ERROR: The ZIP contains no files.')

              parsed = [PurePosixPath(n) for n in files]
              for p in parsed:
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'ERROR: Unsafe ZIP path: {p}')

              wrapper = parsed[0].parts[0] if parsed[0].parts else None
              strip_prefix = bool(wrapper) and all(
                  len(p.parts) > 1 and p.parts[0] == wrapper for p in parsed
              )

              output = root / 'site'
              if output.exists():
                  shutil.rmtree(output)
              output.mkdir(parents=True)

              for name, p in zip(files, parsed):
                  parts = p.parts[1:] if strip_prefix else p.parts
                  if not parts or parts[0] == '.github':
                      continue
                  target = output.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src, dst)

          if not (output / 'index.html').is_file():
              raise SystemExit('ERROR: index.html was not found at site/ root.')
          print(f'SUCCESS: {archive.name} extracted into site/.')
          PY

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Auto-extract website ZIP"
            git push
          fi
