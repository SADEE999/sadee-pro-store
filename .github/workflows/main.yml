
name: Extract Website ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          zips = sorted(
              root.glob("*.zip"),
              key=lambda p: p.stat().st_mtime,
              reverse=True
          )

          if not zips:
              raise SystemExit("ERROR: Upload a ZIP to the repository root.")

          archive = zips[0]
          temp = root / "_zip_extract_temp"
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir()

          with zipfile.ZipFile(archive) as z:
              members = []
              for info in z.infolist():
                  p = PurePosixPath(info.filename)

                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path: " + info.filename)

                  if info.is_dir():
                      continue

                  members.append((info, p))

              if not members:
                  raise SystemExit("ERROR: ZIP is empty.")

              first_parts = [p.parts for _, p in members]
              common = first_parts[0][0] if first_parts[0] else ""
              strip_root = bool(common) and all(
                  len(parts) > 1 and parts[0] == common
                  for parts in first_parts
              )

              for info, p in members:
                  parts = p.parts[1:] if strip_root else p.parts

                  if not parts or parts[0] == ".github":
                      continue

                  target = temp.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          if not (temp / "index.html").is_file():
              raise SystemExit(
                  "ERROR: index.html not found at ZIP website root. "
                  "Check the ZIP folder structure."
              )

          for item in temp.iterdir():
              target = root / item.name

              if item.is_dir():
                  if target.exists():
                      shutil.rmtree(target)
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)

          shutil.rmtree(temp, ignore_errors=True)
          print("ZIP extracted. index.html is in repository root.")
          PY

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- '*.zip'

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract website ZIP"
            git push
          fi
