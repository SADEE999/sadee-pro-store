name: Extract SADEE PRO STORE ZIP

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website files
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          archives = sorted(
              [p for p in root.glob("*.zip") if p.is_file()],
              key=lambda p: p.stat().st_mtime,
              reverse=True
          )

          if not archives:
              raise SystemExit("Upload the final ZIP to repository root.")

          archive = archives[0]

          with zipfile.ZipFile(archive) as z:
              files = [n for n in z.namelist() if not n.endswith("/")]

              paths = [PurePosixPath(n) for n in files]

              for p in paths:
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP path: {p}")

              first = paths[0].parts[0] if paths[0].parts else ""
              strip = bool(first) and all(
                  len(p.parts) > 1 and p.parts[0] == first
                  for p in paths
              )

              site = root / "site"
              functions = root / "netlify" / "functions"

              shutil.rmtree(site, ignore_errors=True)
              shutil.rmtree(functions, ignore_errors=True)

              site.mkdir(parents=True)
              functions.mkdir(parents=True)

              for name, path in zip(files, paths):
                  parts = path.parts[1:] if strip else path.parts

                  if not parts or parts[0] == ".github":
                      continue

                  if parts[:2] == ("netlify", "functions"):
                      target = functions.joinpath(*parts[2:])
                  elif parts[0] == "netlify":
                      continue
                  else:
                      target = site.joinpath(*parts)

                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(name) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          if not (site / "index.html").exists():
              raise SystemExit("ERROR: index.html not found.")

          (root / "netlify.toml").write_text(
              '[build]\n'
              '  publish = "site"\n'
              '  command = ""\n'
              '[functions]\n'
              '  directory = "netlify/functions"\n'
          )

          print("Website and functions extracted successfully.")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f site/ netlify/functions/ netlify.toml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update SADEE PRO STORE website"
            git push
          fi
